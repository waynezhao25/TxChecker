<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TxChecker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>TxChecker</h1>
  <p>Paste an Ethereum transaction hash to check it.</p>

  <form id="form">
    <input id="hash" placeholder="0x..." required>
    <button type="submit">Check</button>
  </form>

  <p id="message"></p>
  <div id="results"></div>

  <script src="script.js"></script>
</body>
</html>
