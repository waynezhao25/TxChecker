AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  RpcUrl:
    Type: String
    NoEcho: true

Resources:
  TxCheckerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.13
      Handler: app.main.handler
      CodeUri: .
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          RPC_URL: !Ref RpcUrl
          TABLE_NAME: !Ref TxCheckerTable  # tells the Python code which table to use
      Policies:
        # SAM shortcut: read/write/delete items on this one table only
        - DynamoDBCrudPolicy:
            TableName: !Ref TxCheckerTable
      FunctionUrlConfig:
        AuthType: NONE

  TxCheckerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST 
      AttributeDefinitions:
        - AttributeName: pk            # only key attributes are declared up front
          AttributeType: S
      KeySchema:
        - AttributeName: pk            # e.g. "TX#1#0xabc..." (later: "WATCH#1#0xdef...")
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at      # optional epoch seconds; DynamoDB deletes the item after it
        Enabled: true

Outputs:
  ApiUrl:
    Value: !GetAtt TxCheckerFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref TxCheckerTable
